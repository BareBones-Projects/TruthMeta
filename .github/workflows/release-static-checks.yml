name: TruthMeta alpha static release checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  extension-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Chrome extension manifest and static security
        run: python3 test_release.py
      - name: Disallow committed SQLite runtime files
        run: |
          if git ls-files 'portal/data/*.db*' | grep .; then
            echo 'SQLite runtime data committed to source tree' >&2
            exit 1
          fi
